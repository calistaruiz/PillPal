<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PillPal sample labels</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0.5in; }
  h1 { font-size: 16pt; }
  p { font-size: 10pt; color: #555; }
  .labels { display: flex; flex-wrap: wrap; gap: 0.25in; }
  .labels img { width: 4in; height: 2in; border: 1px dashed #bbb; }
  .sheet { page-break-before: always; width: 7.5in; }
  @media print { h1, p { display: none; } }
</style>
</head>
<body>
<h1>PillPal sample labels</h1>
<p>Print at 100% scale. Cut out each label and tape it around an empty bottle, then photograph it.
All names and numbers are fictional.</p>
<div class="labels">
  <img src="01-warfarin.png" alt="01-warfarin.png">
  <img src="02-ibuprofen.png" alt="02-ibuprofen.png">
  <img src="03-oxycodone-acetaminophen.png" alt="03-oxycodone-acetaminophen.png">
  <img src="04-lisinopril.png" alt="04-lisinopril.png">
  <img src="05-metformin-spanish.png" alt="05-metformin-spanish.png">
  <img src="06-atorvastatin-chinese.png" alt="06-atorvastatin-chinese.png">
  <img src="07-amlodipine-vietnamese.png" alt="07-amlodipine-vietnamese.png">
  <img src="08-otc-acetaminophen.png" alt="08-otc-acetaminophen.png">
</div>
<img class="sheet" src="09-discharge-sheet.png" alt="Sample discharge sheet">
</body>
</html>
